name: Deploy Backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m pytest -q
      - name: Trigger Render deployment
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        working-directory: .
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
      - name: Explain skipped deployment
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        working-directory: .
        run: echo "RENDER_DEPLOY_HOOK_URL is not configured; verification completed without deployment."
